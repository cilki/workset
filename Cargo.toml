[package]
name = "workset"
description = "Manage git repos with worksets"
version = "0.3.1"
edition = "2024"
authors = ["cilki"]
repository = "https://github.com/fossable/workset/"
readme = "README.md"
license = "Unlicense"
keywords = ["git", "workspace", "cli", "repository", "manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.29", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, optional = true }
gix = { version = "0.87.1", features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
] }
notify = { version = "8.0", optional = true }
pico-args = "0.5"
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.0", default-features = false, features = [
  "crossterm",
], optional = true }
resvg = { version = "0.48", default-features = false, optional = true }
serde_json = "1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["tui"]
tui = [
  "dep:crossterm",
  "dep:ratatui",
  "dep:fuzzy-matcher",
  "dep:notify",
  "dep:image",
  "dep:ratatui-image",
  "dep:resvg",
]
