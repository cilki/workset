[package]
name = "workset"
description = "Manage git repos with worksets"
version = "0.4.0"
edition = "2024"
authors = ["cilki"]
repository = "https://github.com/fossable/workset/"
readme = "README.md"
license = "Unlicense"
keywords = ["git", "workspace", "cli", "repository", "manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
cilki = { version = "0.2", features = ["project-workset"] }
crossterm = { version = "0.29", optional = true }
fuzzy-matcher = { version = "0.3", optional = true }
gix = { version = "0.89.0", features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
] }
notify = { version = "8.0", optional = true }
pico-args = "0.5"
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.0", default-features = false, features = [
  "crossterm",
], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["tui"]
tui = [
  "dep:crossterm",
  "dep:ratatui",
  "dep:fuzzy-matcher",
  "dep:notify",
  "dep:ratatui-image",
  "cilki/terminal-graphics",
]
